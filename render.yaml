# ==============================================================================
# Chotu Restro AI — Render Hosting Blueprint Specification
# Multi-Service Architecture: Next.js Frontend + FastAPI Backend + PostgreSQL DB
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: chotu-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: chotu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: chotu-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://chotu-backend-o8wn.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://chotu-backend-o8wn.onrender.com

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: chotu-db
    databaseName: chotu_restro_ai
    user: chotu_admin
    region: oregon
    plan: free
    ipAllowList: [] # Allows internal secure communication between services
